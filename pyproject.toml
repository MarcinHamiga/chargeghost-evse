[project]
name = "chargeghost-evse"
version = "v0.8.1"
description = "A professional, Python-based Electric Vehicle Supply Equipment (EVSE) simulator featuring a modern graphical user interface built with PySide6 (Qt)."
authors = [
    {name = "Marcin Hamiga",email = "marcin.hamiga@proton.me"}
]
license = {text = "AGPLv3"}
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "ocpp (>=2.1.0,<3.0.0)",
    "websockets (>=16.0,<17.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
    "keyring (>=25.0.0,<26.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)"
]

[tool.poetry]
packages = [{ include = "chargeghost_evse", from = "src" }]

[tool.poetry.scripts]
dev = "chargeghost_evse.main:main_entry"
build-icons = "chargeghost_evse.build_tools.icons:main"
build = "chargeghost_evse.build_tools.binary:main"
api = "chargeghost_evse.api_server:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.02,<10.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "ruff (>=0.15.1,<0.16.0)",
    "pillow (>=10.0.0,<12.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-qt (>=4.5.0,<5.0.0)",
    "pyinstaller (>=6.18.0,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
gui = ["PySide6 (>=6.8.0,<7.0.0)"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
